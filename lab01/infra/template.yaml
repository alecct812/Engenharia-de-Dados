AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Engenharia de Dados - Aula 04 (Exercicio 01): o schema e seu.
  Mesmo lake do Lab 01, com o schema DECLARADO em vez de inferido.
  Nao ha Crawler e, por consequencia, nao ha papel de execucao: sem processo,
  nao ha permissao a conceder.
  Custo estimado: nenhum recurso cobra por hora ligada. O gasto vem do Athena
  (US$ 5,00 por TB varrido, minimo de 10 MB por consulta) e do S3
  (US$ 0,023 por GB-mes). Uma execucao completa fica em torno de US$ 0,02 -
  cerca de um oitavo do Lab 01, porque o Crawler era 88% daquela conta.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Identificacao"
        Parameters:
          - Turma
          - Sufixo
          - Owner
      - Label:
          default: "DECISAO 05 - o teto de bytes por consulta"
        Parameters:
          - TetoBytesPorConsulta
      - Label:
          default: "DECISAO 04 - quais particoes declarar"
        Parameters:
          - DataParticao1
          - DataParticao2
          - DataParticao3

Parameters:
  Turma:
    Type: String
    Description: >-
      Turma no formato AAAA-S. Sem valor padrao: o placeholder do
      parameters.json e recusado por este padrao.
    AllowedPattern: "^[0-9]{4}-[1-2]$"
    ConstraintDescription: Use o formato AAAA-S, por exemplo 2027-1.
  Sufixo:
    Type: String
    Description: >-
      Sufixo dos nomes de recurso. No exercicio ele e o SEU login, e nao a
      turma: a conta e compartilhada, e dois alunos nao podem disputar o mesmo
      nome de bucket nem o mesmo nome de database.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,28}$"
    ConstraintDescription: Minusculas, digitos e hifens, entre 3 e 29 caracteres.
  Owner:
    Type: String
    Description: Seu e-mail institucional, para a tag Owner.
    AllowedPattern: "^[a-z0-9._-]+@cesar\\.school$"
    ConstraintDescription: Use o seu e-mail @cesar.school.

  TetoBytesPorConsulta:
    Type: Number
    Description: >-
      DECISAO 05. Bytes que uma consulta pode varrer antes de o Athena aborta-la.
      O piso de 10485760 e da AWS. O topo util e um byte a menos que o lake
      inteiro - acima disso o freio nunca toca.
    MinValue: 10485760
    MaxValue: 117655605

  DataParticao1:
    Type: String
    Description: >-
      DECISAO 04. Primeira particao declarada, no formato AAAA-MM-DD. O deploy.sh
      calcula as tres datas na hora - nenhuma data e versionada.
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  DataParticao2:
    Type: String
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    Description: Segunda particao declarada.
  DataParticao3:
    Type: String
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    Description: Terceira particao declarada - esta e a de hoje.

Resources:

  # 1 - O lake. Identico ao do Lab 01, e de proposito: o que muda neste
  # exercicio esta no catalogo, nao no armazenamento.
  LakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "eda-a04-lake-${Sufixo}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Disciplina
          Value: EDA
        - Key: Aula
          Value: "04"
        - Key: Turma
          Value: !Ref Turma
        - Key: Owner
          Value: !Ref Owner

  # 2 - O database leva o sufixo, ao contrario do Lab 01. Naquela aula o nome
  # aparecia no SQL projetado e por isso nao podia carregar login; aqui o SQL e
  # digitado por voce, no seu console, com o database escolhido no contexto da
  # consulta - entao a tabela continua se chamando corridas e o SQL do enunciado
  # continua sendo "FROM corridas", sem login nenhum.
  RawDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "eda_a04_raw_${Sufixo}"
        Description: Camada raw do exercicio 01 - schema declarado, sem Crawler.

  # 3 - A tabela. No Lab 01 este bloco nao existia: o Crawler o escrevia em
  # tempo de execucao. Aqui cada coluna e uma decisao tomada por quem escreve,
  # e as tres marcadas abaixo sao as DECISOES 01, 02 e 03.
  CorridasTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableInput:
        Name: corridas
        Description: Eventos de corrida como chegaram, um JSON por linha.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          # O Athena nao le a particao pelo nome da pasta sozinho quando a
          # tabela e declarada a mao: cada particao precisa ser registrada.
          # E o preco da DECISAO 04.
          "projection.enabled": "false"
        PartitionKeys:
          - Name: dt
            Type: string
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/raw/corridas/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          Compressed: false
          StoredAsSubDirectories: false
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              # DECISAO 03 - barulho ou silencio. Escolhido: BARULHO.
              #
              # Medido nesta conta, nao suposto:
              #  - ignore.malformed.json cobre a LINHA que nao e JSON valido.
              #    Neste dado nao existe uma linha assim: trocar true por false
              #    nao mudou NADA (mesmas 245 linhas, mesma consulta OK). A
              #    propriedade e inerte aqui.
              #  - quem decide barulho x silencio de verdade e
              #    use.null.for.invalid.data. Com "true", '8,43' vira null e
              #    sum(valor) devolve 298.049,18 parecendo saudavel, 1,42%
              #    abaixo do real. Com "false", a consulta morre com
              #      BAD_DATA: Error parsing column 'valor' with value '8,43'
              #    e a mensagem nomeia arquivo, coluna, valor e correcao.
              #  - a falha e por COLUNA: SELECT count(*) e o painel de bairros
              #    continuaram respondendo. Quebra so quem le valor.
              #
              # As duas em "false", coerentes: nenhum nulo silencioso.
              "ignore.malformed.json": "false"
              "use.null.for.invalid.data": "false"
          Columns:
            - Name: corrida_id
              Type: string
            - Name: motorista_id
              Type: string
            - Name: passageiro_id
              Type: string
            - Name: bairro
              Type: string
            # DECISAO 02 - o tipo das colunas de tempo.
            # timestamp ou string. O produtor emite AAAA-MM-DDTHH:MM:SSZ.
            # Teste antes de decidir: rode o SELECT e olhe o que voltou.
            # Justifique em DECISOES.md o que o SELECT devolveu - nao o que
            # voce supos.
            - Name: data_corrida
              Type: timestamp
            - Name: fim
              Type: timestamp
            - Name: distancia_km
              Type: double
            - Name: duracao_min
              Type: double
            # DECISAO 01 - o tipo de valor.
            # double, string ou decimal(10,2). Em 1,5% dos eventos o produtor
            # manda "17,82", com virgula decimal.
            # Justifique em DECISOES.md o que voce aceita perder.
            - Name: valor
              Type: decimal(10,2)

  # 4 - As particoes. Tres das trinta, e a ausencia das outras 27 e conteudo:
  # dado nao catalogado e dado que nao existe para quem pergunta.
  # O Location precisa bater EXATAMENTE com a chave do objeto no S3 - se nao
  # bater, o Athena devolve zero linha e nenhum erro.
  Particao1:
    Type: AWS::Glue::Partition
    DependsOn: CorridasTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableName: corridas
      PartitionInput:
        Values:
          - !Ref DataParticao1
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/raw/corridas/dt=${DataParticao1}/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              "ignore.malformed.json": "false"
              "use.null.for.invalid.data": "false"

  # DECISAO 04 - quantas das 30 particoes sao declaradas: TRES.
  # Nao e um numero escolhido no vacuo. O deploy.sh entregue calcula e passa
  # exatamente DataParticao1, 2 e 3 (D-2, D-1 e hoje). Declarar uma quarta
  # exigiria um parametro novo: sem default, o deploy.sh entregue nao subiria
  # a stack; com default, uma data ficaria versionada no repositorio - as duas
  # coisas que o enunciado proibe. Tres e o teto da ferramenta, nao da vontade.
  # As outras 27 continuam no S3 e fora do catalogo: para quem pergunta, nao
  # existem. Justificado em DECISOES.md.
  Particao2:
    Type: AWS::Glue::Partition
    DependsOn: CorridasTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableName: corridas
      PartitionInput:
        Values:
          - !Ref DataParticao2
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/raw/corridas/dt=${DataParticao2}/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              "ignore.malformed.json": "false"
              "use.null.for.invalid.data": "false"

  # A particao de hoje. E ela que o criterio 3 exige nominalmente e a unica que
  # a consulta estreita do criterio 4 le.
  Particao3:
    Type: AWS::Glue::Partition
    DependsOn: CorridasTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref RawDatabase
      TableName: corridas
      PartitionInput:
        Values:
          - !Ref DataParticao3
        StorageDescriptor:
          Location: !Sub "s3://${LakeBucket}/raw/corridas/dt=${DataParticao3}/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              "ignore.malformed.json": "false"
              "use.null.for.invalid.data": "false"

  # 5 - O workgroup. No Lab 01 o teto vinha pronto e nunca tocou; aqui ele sai
  # de uma medicao e precisa matar a consulta larga.
  AnalistasWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "eda-a04-wg-${Sufixo}"
      Description: Workgroup do exercicio 01 - teto calculado, nao presenteado.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: !Ref TetoBytesPorConsulta
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LakeBucket}/athena-results/"
      Tags:
        - Key: Disciplina
          Value: EDA
        - Key: Aula
          Value: "04"
        - Key: Turma
          Value: !Ref Turma
        - Key: Owner
          Value: !Ref Owner

Outputs:
  # Os cinco outputs de contrato. O verifica.sh le estes nomes - nao os mude.
  BucketName:
    Description: Bucket do lake.
    Value: !Ref LakeBucket
  DatabaseName:
    Description: Database no Glue Data Catalog.
    Value: !Ref RawDatabase
  TableName:
    Description: Tabela declarada.
    Value: corridas
  WorkGroupName:
    Description: Workgroup do Athena.
    Value: !Ref AnalistasWorkgroup
  TetoBytes:
    Description: Teto de bytes por consulta, da DECISAO 05.
    Value: !Ref TetoBytesPorConsulta

  # URLs de console - obrigatorias pela convencao, fora do criterio 1.
  ConsoleUrlAthena:
    Description: Console do Athena.
    Value: !Sub "https://console.aws.amazon.com/athena/home?region=${AWS::Region}#/query-editor"
  ConsoleUrlGlue:
    Description: Console do Glue, na tabela declarada.
    Value: !Sub "https://console.aws.amazon.com/glue/home?region=${AWS::Region}#/v2/data-catalog/tables"
  ConsoleUrlS3:
    Description: Console do S3, no prefixo raw/corridas/.
    Value: !Sub "https://console.aws.amazon.com/s3/buckets/${LakeBucket}?region=${AWS::Region}&prefix=raw/corridas/"
